spring.application.name=backend
server.port=8080

# Conexión MySQL (cambia username/password según tu MySQL local)
spring.datasource.url=jdbc:mysql://localhost:3306/hijosdelasventas_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# solo desarrollo: en produccion definir la variable JWT_SECRET (Base64, minimo 32 bytes)
auth.jwt.secret=${JWT_SECRET:Y29kZXIyMDI2cGF1bG95bWF1eWJyYW5jb3ZlbnRhc2hlamVqZWo=}
auth.refresh.secure-cookie=${JWT_REFRESH_SECURE_COOKIE:true}

server.error.include-message=always

# Swagger / Springdoc
springdoc.swagger-ui.path=/swagger-ui.html
